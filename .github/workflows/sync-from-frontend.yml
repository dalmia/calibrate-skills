name: sync-from-frontend

# The skills drive the `calibrate` command, but they also tell people where to
# click in the web app: the URLs they print, the settings page they send someone
# to for an API key, and the names the app shows for things the skills talk about
# out loud. None of that is in the API description, so sync-from-spec cannot see
# it move.
#
# So on every push to prod, Claude reads exactly what that push contained,
# decides whether any of it changes what the skills say, and either edits them or
# drops it. The push carries its own before and after commits, so there is no
# marker to keep and no chance of reading the same release twice.
#
# See .github/SYNC.md for how calibrate-frontend triggers this.
on:
  # Fired by calibrate-frontend on every push to its prod branch.
  repository_dispatch:
    types: [frontend-released]
  # Run by hand — to re-read a release whose run failed, or to check a stretch of
  # prod on demand.
  workflow_dispatch:
    inputs:
      since:
        description: "Frontend commit to read from. Blank reads the latest release on its own."
        required: false
      until:
        description: "Frontend commit to read up to. Blank uses whatever prod is on now."
        required: false

concurrency: sync-from-frontend

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  FRONTEND: ARTPARK-SAHAI-ORG/calibrate-frontend

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read what that release contained
        id: range
        env:
          # Read through the environment, never pasted into the script with
          # ${{ }}: whoever fires the dispatch writes these.
          PUSHED_FROM: ${{ github.event.client_payload.before }}
          PUSHED_TO: ${{ github.event.client_payload.sha }}
          MANUAL_FROM: ${{ inputs.since }}
          MANUAL_TO: ${{ inputs.until }}
          GH_TOKEN: ${{ secrets.FRONTEND_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::FRONTEND_READ_TOKEN is not set. It needs read access to $FRONTEND."
            exit 1
          fi

          TO="${MANUAL_TO:-$PUSHED_TO}"
          # Run by hand with nothing given: read whatever prod is on now.
          [ -n "$TO" ] || TO=$(gh api "repos/$FRONTEND/branches/prod" --jq .commit.sha)

          FROM="${MANUAL_FROM:-$PUSHED_FROM}"
          # A brand new branch pushes from all zeros, and a manual run may give
          # nothing. Either way, read this one release on its own.
          case "$FROM" in
            ""|*[!0-9a-f]*|0000000*) FROM=$(gh api "repos/$FRONTEND/commits/$TO" --jq '.parents[0].sha') ;;
          esac

          case "$FROM$TO" in
            *[!0-9a-f]*|"") echo "::error::Not a commit id: from=$FROM to=$TO"; exit 1 ;;
          esac

          if [ "$FROM" = "$TO" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing between $FROM and $TO."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Reading $FROM..$TO"

          # What shipped: the commit subjects and the files they touched. Small,
          # and on its own often enough to rule a release out.
          {
            printf 'Frontend commits shipped to prod, %s..%s\n\n' "$FROM" "$TO"
            gh api "repos/$FRONTEND/compare/$FROM...$TO" \
              --jq '.commits[] | "- \(.commit.message | split("\n")[0])"'
            printf '\nFiles changed:\n\n'
            gh api "repos/$FRONTEND/compare/$FROM...$TO" \
              --jq '.files[] | "- \(.filename) (+\(.additions) -\(.deletions))"'
          } > frontend-change.md

          # Then the diff itself, capped: a release can be enormous and the
          # question here is narrow.
          printf '\nDiff (capped at 1500 lines):\n\n```diff\n' >> frontend-change.md
          gh api "repos/$FRONTEND/compare/$FROM...$TO" \
            -H "Accept: application/vnd.github.v3.diff" | head -1500 >> frontend-change.md
          printf '\n```\n' >> frontend-change.md

      # Claude Code stops at its first-run setup when it has never run as this
      # user before. On a runner there is nobody to answer it, so it exits before
      # making a single request — the run just fails with no reason given.
      # Saying the setup is already done is what lets the token be used.
      # anthropics/claude-code#8938
      - name: Say the first-run setup is already done
        if: steps.range.outputs.changed == 'true'
        run: |
          echo '{"hasCompletedOnboarding": true}' > "$HOME/.claude.json"

      - name: Work out whether the skills say anything different now
        if: steps.range.outputs.changed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowed-tools "Read,Write,Edit,Glob,Grep,Bash(python3 scripts/check_skills.py)"
          prompt: |
            `frontend-change.md` is everything that shipped to the Calibrate web
            app since this repo last looked.

            This repo holds the Agent Skills that drive the `calibrate` command.
            They are instructions read by a coding agent, which then talks to a
            person. Read `CLAUDE.md` at the root and
            `skills/references/voice.md` before changing any wording.

            **Almost nothing in a frontend release matters here, and saying so is
            the right answer most of the time.** The skills do not use the web
            app. Only four things connect them to it:

            1. **The web addresses the skills print or send someone to.** Today
               those are the settings page for creating an API key and the page
               for one agent. If a page moves, is renamed, or its tab is renamed,
               the skills send people somewhere dead.
            2. **The words someone is told to click.** A skill says to go to
               "Workspace settings → API keys". If the app now calls it something
               else, that instruction no longer matches what is on screen.
            3. **The names the app shows for things the skills also say out
               loud** — what a kind of agent, a kind of test, or a kind of judge
               is called. If the app renames one and a skill keeps the old name,
               the person is looking at two different words for one thing.
            4. **Something the app can now do, or no longer does,** that a skill
               claims otherwise about.

            Everything else is not your concern: components, styling, tests,
            state, performance, refactors, anything that does not change an
            address, a visible name, or what the product can do.

            So:

            - Search `skills/` for every address and every clicked-page name it
              gives out, and check each one against what shipped.
            - Where a skill is now wrong, edit it. Make the real edit, not a note
              about it. Match the file's voice, headings and line wrapping.
            - Do not touch anything about the `calibrate` command. A frontend
              release cannot change what a command accepts, and `sync-from-spec`
              covers that.
            - Run `python3 scripts/check_skills.py` and fix what it reports.

            Then write `SYNC_SUMMARY.md`: one short section per file you changed,
            saying what moved in the app and what you did about it, in plain
            words. If nothing in the skills needed changing — the usual outcome —
            write exactly `NO CHANGES NEEDED` as the whole of `SYNC_SUMMARY.md`
            and edit nothing else.

      - name: Decide whether there is anything to open
        if: steps.range.outputs.changed == 'true'
        id: outcome
        run: |
          # What was actually edited decides this, not what the summary claims,
          # so a run that edits skills but forgets the summary still opens a pull
          # request rather than throwing the edits away.
          EDITED=$(git status --porcelain -- skills)

          # The summary is the pull request body, so it is written outside the
          # repo. Committing it would leave it behind in the merge.
          BODY="$RUNNER_TEMP/pr-body.md"
          if [ -f SYNC_SUMMARY.md ] && ! grep -qx "NO CHANGES NEEDED" SYNC_SUMMARY.md; then
            cp SYNC_SUMMARY.md "$BODY"
          else
            printf 'The web app changed and the skills were edited to match, but no summary was written. Read the diff.\n' > "$BODY"
          fi
          rm -f SYNC_SUMMARY.md frontend-change.md

          if [ -z "$EDITED" ]; then
            echo "skills=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the skills say depends on what shipped."
            exit 0
          fi
          echo "skills=true" >> "$GITHUB_OUTPUT"

          if python3 scripts/check_skills.py; then
            echo "check=passed" >> "$GITHUB_OUTPUT"
          else
            echo "check=FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the pull request
        if: steps.outcome.outputs.skills == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT so skill-check runs on this pull request; one opened with the
          # default GITHUB_TOKEN does not start further CI.
          token: ${{ secrets.SKILLS_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "Update the skills for what shipped in the web app"
          title: "Update the skills for what shipped in the web app"
          body-path: ${{ runner.temp }}/pr-body.md
          branch: automated/frontend-sync
          delete-branch: true
          assignees: dalmia

      - name: Email the pull request link
        if: steps.pr.outputs.pull-request-number
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: aman.dalmia@artpark.in
          subject: "[calibrate-skills] The web app changed and the skills need a look"
          body: |
            Something shipped to the Calibrate web app that changes what the
            skills tell people. They have been updated on a branch for you to
            review. Nothing has been merged.

            Pull request: ${{ steps.pr.outputs.pull-request-url }}
            Installable:  ${{ steps.outcome.outputs.check }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
