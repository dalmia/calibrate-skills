name: diagnose-claude

# Temporary. The Claude step in sync-from-spec fails with no reason given: it
# starts, makes no request, and exits. The action swallows whatever the real
# error is, so this runs the same command by hand and prints it.
#
# Delete this file once the cause is known.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Version and starting state
        run: |
          claude --version
          echo "--- HOME is $HOME"
          echo "--- ~/.claude.json before:"
          cat "$HOME/.claude.json" 2>&1 || echo "(no file)"

      - name: Run it with nothing set up, as the action does
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "--- token length: ${#CLAUDE_CODE_OAUTH_TOKEN}, starts: ${CLAUDE_CODE_OAUTH_TOKEN:0:12}"
          set +e
          claude -p "Reply with the single word OK" --output-format json 2>&1 | head -60
          echo "--- exit: $?"

      - name: Run it again, saying the first-run setup is done
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo '{"hasCompletedOnboarding": true}' > "$HOME/.claude.json"
          set +e
          claude -p "Reply with the single word OK" --output-format json 2>&1 | head -60
          echo "--- exit: $?"

      - name: Run it again in debug, for the real error
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          claude -p "Reply with the single word OK" --debug 2>&1 | tail -60
          echo "--- exit: $?"
